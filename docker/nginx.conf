server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets normally; fall back to index.html for all other
    # paths so that React Router's client-side routes work after a hard reload.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively — Vite hashes filenames on build.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Do not cache the HTML shell — browsers should always re-request it
    # so they pick up new deployments.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

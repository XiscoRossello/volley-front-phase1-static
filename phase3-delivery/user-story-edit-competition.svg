<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" font-family="Inter, Arial, sans-serif" font-size="13">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1d1031; }
    .box { fill: #ffffff; stroke: #7c3aed; stroke-width: 1.5; rx: 10; ry: 10; }
    .label { fill: #1d1031; font-weight: 600; }
    .sub { fill: #4c4468; font-size: 12px; }
    .arrow { stroke: #5b21b6; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
    .btn-outline { fill: #fff; stroke: #7c3aed; rx: 8; ry: 8; }
    .btn-text-outline { fill: #7c3aed; font-weight: bold; font-size: 14px; }
    .btn { fill: #7c3aed; rx: 8; ry: 8; }
    .btn-text { fill: #fff; font-weight: bold; font-size: 14px; }
    .ok { fill: #e8f7ef; stroke: #10b981; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5b21b6"/>
    </marker>
  </defs>
  
  <text x="30" y="40" class="title">User Story 6 — Edit Competition Score &amp; Roster</text>

  <g>
    <!-- Screen 1: Default View -->
    <text x="30" y="90" class="label">Screen 1: Detail page</text>
    <rect class="box" x="30" y="110" width="340" height="150"/>
    <text x="50" y="140" class="title">Sprint Championship 2025</text>
    
    <rect class="btn-outline" x="50" y="170" width="150" height="30" />
    <text x="65" y="190" class="btn-text-outline">✏️ Edit competition</text>

    <path class="arrow" d="M380 185 L440 185"/>

    <!-- Screen 2: Edit Form -->
    <text x="450" y="90" class="label">Screen 2: Inline Edit Form (PATCH)</text>
    <rect class="box" x="450" y="110" width="340" height="380"/>
    <text x="470" y="140" class="label">Score (medal counts)</text>
    
    <rect x="470" y="150" width="300" height="30" fill="#f3e8ff" />
    <text x="480" y="170" class="label">Discipline | Gold | Silver | Bronze</text>

    <text x="480" y="200" class="sub">Sprints</text>
    <rect x="580" y="185" width="40" height="20" fill="#fff" stroke="#cbd5e1" rx="4"/>
    <text x="595" y="200">2</text>
    <rect x="640" y="185" width="40" height="20" fill="#fff" stroke="#cbd5e1" rx="4"/>
    <text x="655" y="200">1</text>
    <rect x="700" y="185" width="40" height="20" fill="#fff" stroke="#cbd5e1" rx="4"/>
    <text x="715" y="200">0</text>

    <text x="470" y="250" class="label">Athletes attending</text>
    <rect x="470" y="260" width="300" height="80" fill="#fff" stroke="#cbd5e1" rx="4"/>
    <text x="495" y="280">☑ Maria García</text>
    <text x="495" y="300">☐ John Doe</text>
    <text x="495" y="320">☑ Jane Smith</text>

    <rect class="btn" x="470" y="360" width="120" height="30" />
    <text x="485" y="380" class="btn-text">Save changes</text>

    <path class="arrow" d="M800 240 L860 240"/>

    <!-- Screen 3: Success -->
    <text x="870" y="90" class="label">Screen 3: Success Reload</text>
    <rect class="box" x="870" y="110" width="200" height="150"/>
    <text x="890" y="140" class="title">Score</text>
    <text x="890" y="170" class="label">Sprints</text>
    <text x="890" y="190" class="sub">🥇 2 &amp;nbsp; 🥈 1 &amp;nbsp; 🥉 0</text>

    <rect class="ok" x="870" y="330" width="200" height="40" rx="8" />
    <text x="885" y="355" fill="#065f46" font-weight="bold">✓ Competition updated</text>

  </g>
</svg>

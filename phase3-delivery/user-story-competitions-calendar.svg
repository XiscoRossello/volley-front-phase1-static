<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" font-family="Inter, Arial, sans-serif" font-size="13">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1d1031; }
    .box { fill: #ffffff; stroke: #7c3aed; stroke-width: 1.5; rx: 10; ry: 10; }
    .label { fill: #1d1031; font-weight: 600; }
    .sub { fill: #4c4468; font-size: 12px; }
    .arrow { stroke: #5b21b6; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
    .btn { fill: #7c3aed; rx: 8; ry: 8; }
    .btn-text { fill: #fff; font-weight: bold; font-size: 14px; }
    .btn-outline { fill: #fff; stroke: #7c3aed; rx: 8; ry: 8; }
    .btn-text-outline { fill: #7c3aed; font-weight: bold; font-size: 14px; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5b21b6"/>
    </marker>
  </defs>
  
  <text x="30" y="40" class="title">User Story 3 — Browse Competitions Calendar</text>

  <g>
    <!-- Screen 1: List -->
    <text x="30" y="90" class="label">Screen 1: List View</text>
    <rect class="box" x="30" y="110" width="400" height="400"/>
    
    <text x="50" y="140" class="title">Competitions</text>

    <rect class="box" x="50" y="170" width="360" height="100" />
    <text x="70" y="200" class="label">Sprint Championship 2025</text>
    <text x="70" y="220" class="sub">Season 2024/2025</text>
    <rect class="btn-outline" x="70" y="235" width="100" height="26" />
    <text x="80" y="253" class="btn-text-outline" font-size="12">View details</text>

    <rect class="box" x="50" y="290" width="360" height="100" />
    <text x="70" y="320" class="label">Winter Cup</text>
    <text x="70" y="340" class="sub">Season 2024/2025</text>
    <rect class="btn-outline" x="70" y="355" width="100" height="26" />
    <text x="80" y="373" class="btn-text-outline" font-size="12">View details</text>

    <path class="arrow" d="M180 248 L480 248"/>

    <!-- Screen 2: Detail -->
    <text x="490" y="90" class="label">Screen 2: Detail View (Phase 3 adds Edit button)</text>
    <rect class="box" x="490" y="110" width="550" height="500"/>
    
    <text x="510" y="140" class="title">Sprint Championship 2025</text>

    <rect class="btn-outline" x="880" y="120" width="140" height="30" />
    <text x="895" y="140" class="btn-text-outline">✏️ Edit competition</text>

    <text x="510" y="180" class="sub">When: Dec 15, 2024</text>
    <text x="510" y="200" class="sub">Season: 2024/2025</text>

    <rect class="box" x="510" y="230" width="510" height="80" />
    <text x="530" y="250" class="label">Venue</text>
    <text x="530" y="270" class="sub">Main Stadium (Outdoor) — Capacity: 10000</text>
    <text x="530" y="290" class="sub">123 Olympic Way</text>

    <rect class="box" x="510" y="330" width="510" height="130" />
    <text x="530" y="350" class="label">Score</text>
    <text x="530" y="380" class="sub">Sprints</text>
    <text x="650" y="380" class="sub">🥇 2 &amp;nbsp; 🥈 1 &amp;nbsp; 🥉 0</text>
    <text x="530" y="410" class="sub">High jump</text>
    <text x="650" y="410" class="sub">🥇 0 &amp;nbsp; 🥈 0 &amp;nbsp; 🥉 1</text>
    <text x="530" y="440" class="sub">Long jump</text>
    <text x="650" y="440" class="sub">🥇 1 &amp;nbsp; 🥈 0 &amp;nbsp; 🥉 0</text>

    <path class="arrow" stroke="#7c3aed" d="M1030 135 L1080 135 L1080 300 L950 300"/>
    <text x="1085" y="220" class="sub" fill="#7c3aed">Clicking</text>
    <text x="1085" y="235" class="sub" fill="#7c3aed">Edit expands</text>
    <text x="1085" y="250" class="sub" fill="#7c3aed">Story 6 form</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" font-family="Inter, Arial, sans-serif" font-size="13">
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1d1031; }
    .box { fill: #ffffff; stroke: #7c3aed; stroke-width: 1.5; rx: 10; ry: 10; }
    .label { fill: #1d1031; font-weight: 600; }
    .arrow { stroke: #5b21b6; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
    .btn { fill: #7c3aed; rx: 8; ry: 8; }
    .btn-outline { fill: #fff; stroke: #7c3aed; rx: 8; ry: 8; }
    .btn-danger { fill: #fff; stroke: #dc2626; rx: 8; ry: 8; }
    .btn-danger-fill { fill: #dc2626; rx: 8; ry: 8; }
    .btn-text { fill: #fff; font-weight: bold; font-size: 14px; }
    .btn-text-outline { fill: #7c3aed; font-weight: bold; font-size: 14px; }
    .btn-text-danger { fill: #dc2626; font-weight: bold; font-size: 14px; }
    .ok { fill: #e8f7ef; stroke: #10b981; stroke-width: 1.5; }
    .confirm-box { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; rx: 8; ry: 8; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5b21b6"/>
    </marker>
  </defs>
  
  <text x="30" y="40" class="title">User Story 4 — Athlete Profile (Edit &amp; Delete)</text>

  <g>
    <!-- View Mode -->
    <text x="30" y="90" class="label">Panel A: View mode</text>
    <rect class="box" x="30" y="110" width="340" height="200"/>
    <text x="50" y="140" class="title">Maria García</text>
    
    <rect class="btn-outline" x="180" y="120" width="60" height="26" />
    <text x="195" y="138" class="btn-text-outline" font-size="12">✏️ Edit</text>

    <rect class="btn-danger" x="250" y="120" width="80" height="26" />
    <text x="260" y="138" class="btn-text-danger" font-size="12">🗑 Delete</text>

    <text x="50" y="180" class="label">Email: maria@example.com</text>

    <path class="arrow" d="M210 150 L210 280 L400 280"/>
    <path class="arrow" stroke="#dc2626" d="M290 150 L290 440 L400 440"/>

    <!-- Edit Mode -->
    <text x="410" y="210" class="label">Panel B: Edit mode (PATCH)</text>
    <rect class="box" x="410" y="230" width="340" height="150"/>
    <text x="430" y="260" class="title">Maria García</text>
    <rect x="430" y="280" width="300" height="30" fill="#fff" stroke="#cbd5e1" rx="6" />
    <text x="440" y="300" fill="#475569">maria_updated@example.com</text>
    
    <rect class="btn" x="430" y="330" width="120" height="30" />
    <text x="445" y="350" class="btn-text">Update athlete</text>

    <!-- Delete Mode -->
    <text x="410" y="410" class="label" fill="#dc2626">Panel C: Delete Confirm (DELETE)</text>
    <rect class="confirm-box" x="410" y="430" width="340" height="120"/>
    <text x="430" y="460" class="label" fill="#991b1b">Are you sure you want to permanently</text>
    <text x="430" y="480" class="label" fill="#991b1b">delete Maria García?</text>
    
    <rect class="btn-danger-fill" x="430" y="500" width="100" height="30" />
    <text x="445" y="520" class="btn-text">Yes, delete</text>

    <path class="arrow" stroke="#10b981" d="M760 305 L820 305"/>
    <path class="arrow" stroke="#dc2626" d="M760 490 L820 490"/>

    <!-- Outcomes -->
    <text x="830" y="260" class="label">Edit Success (stays on page)</text>
    <rect class="ok" x="830" y="280" width="240" height="40" rx="8" />
    <text x="845" y="305" fill="#065f46" font-weight="bold">✓ Athlete updated</text>

    <text x="830" y="450" class="label">Delete Success (redirect to list)</text>
    <rect class="ok" x="830" y="470" width="240" height="40" rx="8" />
    <text x="845" y="495" fill="#065f46" font-weight="bold">✓ Maria García deleted</text>

  </g>
</svg>
